plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.google.services)
    alias(libs.plugins.kotlin.compose)
}

// قراءة ملف local.properties لاستخراج مفتاح Gemini
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

android {
    namespace 'com.example.graduationproject'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.graduationproject"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true

        // API Keys from local.properties
        buildConfigField "String", "GEMINI_API_KEY", "\"${localProperties.getProperty('GEMINI_API_KEY', '')}\""
        buildConfigField "String", "YOUTUBE_API_KEY", "\"${localProperties.getProperty('YOUTUBE_API_KEY', '')}\""
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
    }

    configurations.all {
        resolutionStrategy {
            force 'androidx.activity:activity:1.9.3'
            force 'androidx.activity:activity-ktx:1.9.3'
            force 'androidx.activity:activity-compose:1.9.3'
        }
    }


    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding true
        buildConfig true
        compose true

    }
}

dependencies {
    implementation libs.core
    implementation libs.core.ktx
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.activity
    implementation libs.activity.ktx
    implementation libs.cardview
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation("androidx.navigation:navigation-fragment-ktx:2.8.0")
    implementation("androidx.navigation:navigation-ui-ktx:2.8.0")

    implementation platform(libs.compose.bom)
    implementation libs.activity.compose
    implementation libs.engage.core
    implementation libs.lifecycle.runtime.ktx
    implementation libs.material3
    implementation libs.mpandroidchart

    implementation libs.flexbox
    implementation libs.lottie
    implementation libs.rive.android
    implementation libs.glide
    implementation libs.room.common.jvm
    implementation libs.room.runtime
    implementation libs.shimmer

    implementation libs.ui
    implementation libs.ui.graphics
    implementation libs.ui.tooling.preview

    // Glide (مكتبة الصور)
    annotationProcessor libs.glide.compiler

    // Retrofit & Gson
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Android YouTube Player
    implementation 'com.pierfrancescosoffritti.androidyoutubeplayer:core:12.1.0'

    // Firebase & Gemini AI Logic
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.ai
    implementation "com.google.guava:guava:31.0.1-android"
    implementation "com.google.firebase:firebase-appcheck-debug"
    implementation("com.squareup.okhttp3:okhttp:4.12.0")
    implementation 'net.zetetic:android-database-sqlcipher:4.5.4@aar'
    implementation 'androidx.sqlite:sqlite:2.3.1'

    // Testing
    testImplementation libs.junit



    androidTestImplementation platform(libs.compose.bom)
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ui.test.junit4
    annotationProcessor libs.room.compiler
    debugImplementation libs.ui.test.manifest
    debugImplementation libs.ui.tooling
}
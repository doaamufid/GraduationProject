plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.google.services)
}

// ⬇️ إضافة جديدة: قراءة ملف local.properties
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
    alias(libs.plugins.kotlin.compose)
}

android {
    namespace 'com.example.graduationproject'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "com.example.graduationproject"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // ⬇️ إضافة جديدة: نحط المفتاح جوا BuildConfig
        buildConfigField "String", "GEMINI_API_KEY", "\"${localProperties.getProperty('GEMINI_API_KEY', '')}\""
    }
    buildToolsVersion "36.0.0"

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        viewBinding true
        buildConfig true   // ⬅️ إضافة جديدة: لازم نفعّلها عشان BuildConfig يشتغل
        compose true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'androidx.core:core:1.12.0'
    implementation platform(libs.compose.bom)
    implementation libs.activity.compose
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.lifecycle.runtime.ktx
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.material3
    implementation libs.mpandroidchart
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation libs.flexbox
    // احذفي القديم وضعي هذا بدقة:
    implementation("androidx.navigation:navigation-fragment-ktx:2.8.0")
    implementation("androidx.navigation:navigation-ui-ktx:2.8.0")

    implementation libs.ui
    implementation libs.ui.graphics
    implementation libs.ui.tooling.preview

    // ⬇️ إضافة جديدة: مكتبة للاتصال بالإنترنت (Gemini API)
    implementation("com.squareup.okhttp3:okhttp:4.12.0")
    // Firebase AI Logic (Gemini Developer API - free tier, no billing needed)
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.ai
    implementation "com.google.guava:guava:31.0.1-android"
    implementation "com.google.firebase:firebase-appcheck-debug"

    testImplementation libs.junit
    androidTestImplementation platform(libs.compose.bom)
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ui.test.junit4
    debugImplementation libs.ui.test.manifest
    debugImplementation libs.ui.tooling
}